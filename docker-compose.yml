
x-airflow-common: &airflow-common
  build: .
  image: mri-airflow:latest

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__WEBSERVER__SECRET_KEY: "mri_project_secret_key"

  volumes:
    # DAGs
    - ./airflow/dags:/opt/airflow/dags

    # Code source du projet
    - ./:/opt/airflow/project

    # Logs Airflow
    - ./airflow/logs:/opt/airflow/logs

    # Plugins
    - ./airflow/plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy


services:

  # PostgreSQL
  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  # Initialisation Airflow
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

    restart: "no"


  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always


  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: always


volumes:
  postgres-db-volume:
